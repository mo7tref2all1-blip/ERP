name: Deploy to cPanel

on:
  push:
    branches: [ main, master ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy Wood ERP to cPanel

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_mysql, mbstring, xml, curl, zip, gd
          coverage: none

      - name: Install Composer dependencies
        run: |
          composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      - name: Build frontend assets
        run: |
          if [ -f package.json ]; then
            npm ci
            npm run build
          fi

      - name: Prepare .env
        run: |
          cp .env.example .env
          php artisan key:generate --no-interaction

      - name: Create deployment archive
        run: |
          tar -czf deploy.tar.gz \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='tests' \
            --exclude='deploy.tar.gz' \
            .

      - name: Deploy via FTP to cPanel
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/tests/**
            deploy.tar.gz
            .env

      - name: Run migrations via cPanel API
        if: ${{ secrets.CPANEL_TOKEN != '' }}
        run: |
          # استخدم cPanel UAPI لتشغيل الأوامر عبر SSH أو Terminal
          echo "تم النشر بنجاح. يرجى تشغيل الأوامر التالية عبر Terminal في cPanel:"
          echo "cd ${{ secrets.FTP_SERVER_DIR }} && php artisan migrate --force && php artisan optimize"
